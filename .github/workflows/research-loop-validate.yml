name: research-loop-validate
on:
  push:
    branches: [research-loop]
  pull_request:
    branches: [research-loop]
permissions:
  contents: read
concurrency:
  group: research-loop-validation-${{ github.ref }}
  cancel-in-progress: false
jobs:
  control-protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install control validator only
        run: python -m pip install jsonschema==4.25.1
      - name: Test synthetic control fixtures (no SafeVLA)
        run: python scripts/test_research_loop.py
      - name: Validate every control commit and artifact
        run: python scripts/validate_research_loop.py --history

