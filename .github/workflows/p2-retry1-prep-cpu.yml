name: p2-retry1-preparation-CPU-checks
on:
  push:
    branches: [feature/p2-ndarray-metrics-manual-retry-20261013]
permissions:
  contents: read
jobs:
  pure-cpu-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install NumPy for metadata serializer unit tests
        run: python -m pip install numpy==1.26.4
      - name: Validate syntax and zero-GPU entry
        run: |
          bash -n diagnostics/actor_logits/run_p2_full400.sh
          python - <<'PY'
          import ast
          from pathlib import Path
          for name in ['diagnostics/actor_logits/evaluate.py',
                       'diagnostics/actor_logits/storage.py',
                       'diagnostics/actor_logits/reset.py',
                       'diagnostics/actor_logits/logger.py',
                       'diagnostics/actor_logits/tests/test_metrics_json_codec.py']:
              ast.parse(Path(name).read_text(), filename=name)
          print('P2_RETRY1_CPU_STATIC_PASS')
          PY
      - name: Only test metadata JSON compatibility (never start GPU/model)
        run: python -m unittest diagnostics.actor_logits.tests.test_metrics_json_codec -v
