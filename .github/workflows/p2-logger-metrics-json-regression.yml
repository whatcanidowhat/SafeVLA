name: p2-logger-metrics-json-regression
on:
  push:
    branches: [fix/p2-logger-ndarray-metrics-20261013]
permissions:
  contents: read
jobs:
  pure-cpu-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install NumPy for metadata-only tests
        run: python -m pip install numpy==1.26.4
      - name: Check Python syntax of the isolated fix
        run: python -m compileall -q diagnostics/actor_logits/storage.py diagnostics/actor_logits/tests/test_metrics_json_codec.py
      - name: Run NumPy metadata JSON regression only (no model / GPU)
        run: python -m unittest diagnostics.actor_logits.tests.test_metrics_json_codec -v
